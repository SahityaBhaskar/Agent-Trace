version: "3.9"

services:
  agenttrace:
    build: .
    container_name: agenttrace
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the Developer Knowledge Graph across container restarts
      - agenttrace-kg:/root/.agenttrace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agenttrace-kg:
    driver: local
