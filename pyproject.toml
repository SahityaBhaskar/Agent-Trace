[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agenttrace"
version = "1.0.0"
description = "Explainability and Developer Learning Layer for AI Coding Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "coding-agents", "explainability", "developer-tools", "git"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "google-genai>=2.0.0",
    "httpx>=0.27.0",
    "waitress>=3.0.0",
    "supabase>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
agenttrace = "agent_trace.cli:main"

[project.urls]
Repository = "https://github.com/your-org/agent-trace"
Issues = "https://github.com/your-org/agent-trace/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_trace*"]

[tool.setuptools.package-data]
agent_trace = ["web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that spin up a live HTTP server (deselect with '-m not integration')",
]
